<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#082b4c">
  <title>That Eye Place — Sales Pricing</title>
  <style>
    :root{--navy:#082b4c;--navy2:#114c78;--orange:#f47c20;--cream:#f7f2e8;--ink:#173047;--muted:#667786;--line:#d9e0e5;--white:#fff;--green:#23825c;--red:#c94d45;--shadow:0 15px 40px rgba(8,43,76,.11)}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fbf8f1 0,#eef4f7 100%);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button{font:inherit;color:inherit}
    .topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px max(20px,calc((100vw - 1220px)/2));background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
    .brand{display:flex;gap:12px;align-items:center}.brand-mark{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--navy);font-size:24px}.brand span,.quote-title span{display:block;font-size:11px;font-weight:850;letter-spacing:.16em;color:var(--orange)}.brand strong{display:block;font-size:20px;color:var(--navy)}
    .reset{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:10px;font-weight:750;cursor:pointer}.reset:hover{border-color:var(--orange)}
    .shell{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:26px;width:min(1220px,calc(100% - 40px));margin:32px auto 70px}.intro{padding:10px 4px 22px}.intro p{margin:0 0 6px;color:var(--orange);font-size:12px;font-weight:900;letter-spacing:.17em}.intro h1{margin:0;color:var(--navy);font-size:clamp(30px,4vw,46px);line-height:1.06}.intro span{display:block;margin-top:10px;color:var(--muted)}
    .step{background:rgba(255,255,255,.96);border:1px solid #dfe5e9;border-radius:20px;padding:24px;margin-bottom:18px;box-shadow:0 8px 22px rgba(8,43,76,.05);animation:reveal .22s ease-out}@keyframes reveal{from{opacity:0;transform:translateY(7px)}}
    .step-head{display:flex;gap:13px;align-items:flex-start;margin-bottom:18px}.step-num{flex:0 0 34px;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;font-weight:900}.step h2{margin:1px 0 3px;color:var(--navy);font-size:20px}.step p{margin:0;color:var(--muted);font-size:14px}.choices{display:grid;gap:12px}.choices.three{grid-template-columns:repeat(3,1fr)}.choices.two{grid-template-columns:repeat(2,1fr)}
    .choice{position:relative;display:flex;flex-direction:column;align-items:flex-start;min-height:105px;padding:18px;border:2px solid #dbe2e7;border-radius:15px;background:#fff;text-align:left;cursor:pointer;overflow:hidden;transition:.15s}.choice:hover{transform:translateY(-1px);border-color:#9bb1c1}.choice.active{border-color:var(--orange);background:#fffaf5;box-shadow:0 0 0 3px rgba(244,124,32,.12)}.choice strong{font-size:16px;color:var(--navy);padding-right:24px}.choice small{margin-top:5px;color:var(--muted);line-height:1.25}.price{margin-top:auto;padding-top:12px;font-weight:900;color:var(--orange);font-size:18px}.tick{position:absolute;right:12px;top:10px;display:none;color:var(--orange);font-weight:1000}.active .tick{display:block}.accent{height:7px;position:absolute;inset:0 0 auto}.accent.navy{background:#0b355e}.accent.orange{background:#f47c20}.accent.split{background:linear-gradient(90deg,#c94d45 0 50%,#23825c 50%)}
    .yesno{display:grid;grid-template-columns:1fr 1fr;gap:10px}.yesno button{border:2px solid #dbe2e7;background:#fff;padding:15px;border-radius:12px;font-weight:800;cursor:pointer}.yesno button.active{border-color:var(--orange);background:#fff7ef;color:#a44b0b}
    .modifier-groups{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.mod-group{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fafcfd}.mod-group legend{padding:0 5px;color:var(--orange);font-size:11px;font-weight:900;letter-spacing:.12em}.mod-row{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;padding:9px 2px;border-bottom:1px solid #e9edef;font-size:13px;cursor:pointer}.mod-row:last-of-type{border-bottom:0}.mod-row input{width:17px;height:17px;accent-color:var(--orange)}.mod-row b{white-space:nowrap}.discount{color:var(--green)}.included{font-size:11px!important;margin-top:9px!important}.additional{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.additional h3{margin:0 0 12px;color:var(--navy)}.mod-title{margin-top:22px!important;margin-bottom:4px!important}
    .quote{position:sticky;top:94px;align-self:start;background:var(--navy);color:white;border-radius:22px;padding:24px;box-shadow:var(--shadow)}.quote-title{display:flex;gap:11px;align-items:center;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.18)}.quote-icon{font-size:25px}.quote-title strong{display:block;font-size:20px}.summary{min-height:128px;padding:14px 0}.empty{text-align:center;color:#c4d2dc;padding:20px 10px}.summary-row{display:flex;justify-content:space-between;gap:14px;padding:8px 0;font-size:14px}.summary-row span{color:#cbd7df}.summary-row strong{text-align:right}.divider{border-top:1px solid rgba(255,255,255,.2);margin:8px 0}.total{display:flex;align-items:flex-end;justify-content:space-between;padding:18px 0;border-top:1px solid rgba(255,255,255,.25)}.total span{font-size:12px;font-weight:900;letter-spacing:.14em}.total strong{font-size:36px;color:#ff9b4d}.copy{width:100%;padding:14px;border:0;border-radius:12px;background:var(--orange);color:#fff;font-weight:900;cursor:pointer}.copy:disabled{opacity:.45;cursor:not-allowed}.foot{margin:14px 0 0;color:#c6d3dc;font-size:11px;line-height:1.45}.same-rx{font-weight:900;color:var(--navy)!important}
    @media(max-width:900px){.shell{grid-template-columns:1fr}.quote{position:static;order:-1}.modifier-groups{grid-template-columns:1fr}.choices.three{grid-template-columns:1fr}.choice{min-height:92px}}@media(max-width:560px){.topbar{padding:11px 14px}.brand span{display:none}.brand strong{font-size:16px}.brand-mark{width:40px;height:40px}.reset{padding:9px}.shell{width:calc(100% - 24px);margin-top:18px}.step{padding:18px}.choices.two,.yesno{grid-template-columns:1fr}.quote{padding:20px}.intro h1{font-size:32px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true">👓</div><div><span>THAT EYE PLACE</span><strong>Sales Pricing</strong></div></div><button class="reset" id="reset">↻ Start Over</button></header>
  <main class="shell"><section><div class="intro"><p>QUICK QUOTE</p><h1>Build the sale. See the price.</h1><span>Select each step and the total updates automatically.</span></div><div id="steps"></div></section><aside class="quote" aria-live="polite"><div class="quote-title"><div class="quote-icon">▤</div><div><span>RUNNING QUOTE</span><strong>Sale Summary</strong></div></div><div class="summary" id="summary"></div><div class="total"><span>TOTAL</span><strong id="total">$0</strong></div><button class="copy" id="copy" disabled>▣ Copy Quote</button><p class="foot">Every complete pair includes premium anti-reflective, scratch resistance, UV protection, and standard warranty unless modified.</p></aside></main>
  <script>
    const frames={redGreen:{name:'RED / GREEN',retail:100,accent:'split'},navy:{name:'NAVY',retail:150,accent:'navy'},orange:{name:'ORANGE',retail:300,accent:'orange'}};
    const lenses={core:{name:'clear&CORE™',note:'Rx power 3.00 or less',additional:149},strong:{name:'thin&STRONG™',note:'Rx powers up to 5.00 or safety use',additional:179},clear:{name:'thin&CLEAR™',note:'Rx powers over 5.00',additional:249}};
    const complete={core:{redGreen:250,navy:275,orange:350},strong:{redGreen:300,navy:325,orange:400},clear:{redGreen:400,navy:425,orange:500}};
    const mods=[['standard','Standard Finish (No AR)',-75,'VISION'],['pof','POF',-50,'VISION'],['shift','Shift™',90,'VISION'],['multifocal','Multifocal',50,'VISION'],['mirror','Mirror / Solid Tint',50,'STYLE'],['flash','Flash Mirror / Gradient Tint',100,'STYLE'],['drill','Drill Mount',50,'STYLE'],['bevel','Step Bevel',50,'STYLE'],['rush','Same Day / Rush',25,'CONVENIENCE'],['shipping','Shipping',25,'CONVENIENCE']];
    let s={frame:null,sale:null,lens:null,wantsMods:null,selected:[],wantsAdditional:null,additionalLens:null,additional:[]};const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n);
    const base=()=>!s.frame||!s.sale?0:s.sale==='pof'?frames[s.frame].retail/2:s.lens?complete[s.lens][s.frame]:0;const modTotal=a=>mods.filter(m=>a.includes(m[0])).reduce((n,m)=>n+m[2],0);const total=()=>base()+modTotal(s.selected)+(s.wantsAdditional&&s.additionalLens?lenses[s.additionalLens].additional:0)+modTotal(s.additional);
    function choice(id,title,detail,price,active,accent){return `<button class="choice ${active?'active':''}" data-action="${id}">${accent?`<i class="accent ${accent}"></i>`:''}<span class="tick">✓</span><strong>${title}</strong>${detail?`<small>${detail}</small>`:''}${price?`<span class="price">${price}</span>`:''}</button>`}
    function step(n,title,note,body){return `<section class="step"><div class="step-head"><span class="step-num">${n}</span><div><h2>${title}</h2><p>${note}</p></div></div>${body}</section>`}
    function modGrid(selected,prefix,hidePof){return `<div class="modifier-groups">${['VISION','STYLE','CONVENIENCE'].map(g=>`<fieldset class="mod-group"><legend>${g}</legend>${mods.filter(m=>m[3]===g&&!(hidePof&&m[0]==='pof')).map(m=>`<label class="mod-row"><input type="checkbox" data-action="${prefix}${m[0]}" ${selected.includes(m[0])?'checked':''}><span>${m[1]}</span><b class="${m[2]<0?'discount':''}">${m[2]>0?'+ ':'- '}${money(Math.abs(m[2]))}</b></label>`).join('')}${g==='VISION'&&hidePof?'<p class="included">POF pricing is already applied to this sale.</p>':''}</fieldset>`).join('')}</div>`}
    function render(){let html=step(1,'Select the frame collection','Retail price shown for reference.',`<div class="choices three">${Object.entries(frames).map(([k,f])=>choice('frame:'+k,f.name,money(f.retail)+' retail','',s.frame===k,f.accent)).join('')}</div>`);
      if(s.frame)html+=step(2,'What type of sale?','Choose POF pricing or a complete pair.',`<div class="choices two">${choice('sale:pof','POF','50% of frame retail',money(frames[s.frame].retail/2),s.sale==='pof')}${choice('sale:complete','COMPLETE SALE','Frame + complete lenses','',s.sale==='complete')}</div>`);
      if(s.sale==='complete')html+=step(3,'Select the complete-pair package','Pricing includes the selected frame collection.',`<div class="choices three">${Object.entries(lenses).map(([k,l])=>choice('lens:'+k,l.name,l.note,s.frame?money(complete[k][s.frame]):'',s.lens===k)).join('')}</div>`);
      const ready=s.frame&&s.sale&&(s.sale==='pof'||s.lens);if(ready){const n=s.sale==='complete'?4:3;html+=step(n,'Any modifiers?','Each selected modifier changes the running total.',`<div class="yesno"><button data-action="mods:no" class="${s.wantsMods===false?'active':''}">No modifiers</button><button data-action="mods:yes" class="${s.wantsMods===true?'active':''}">Yes, select modifiers</button></div>${s.wantsMods?modGrid(s.selected,'mod:',s.sale==='pof'):''}`)}
      if(ready&&s.wantsMods!==null){const n=s.sale==='complete'?5:4;html+=step(n,'Add another complete pair?','Same prescription required. Modifiers still apply.',`<div class="yesno"><button data-action="additional:no" class="${s.wantsAdditional===false?'active':''}">No additional pair</button><button data-action="additional:yes" class="${s.wantsAdditional===true?'active':''}">Yes, add a pair</button></div>${s.wantsAdditional?`<div class="additional"><h3>Additional-pair package</h3><p class="same-rx">Same prescription required. Modifiers still apply.</p><div class="choices three">${Object.entries(lenses).map(([k,l])=>choice('additionalLens:'+k,l.name,'',money(l.additional),s.additionalLens===k)).join('')}</div><h3 class="mod-title">Additional-pair modifiers</h3><p>Select only what applies to this pair.</p>${modGrid(s.additional,'additionalMod:',false)}</div>`:''}`)}document.getElementById('steps').innerHTML=html;renderSummary()}
    function renderSummary(){let h='';if(!s.frame)h='<div class="empty">👓<br>Start by selecting a frame collection.</div>';else{h+=row('Frame collection',frames[s.frame].name);if(s.sale)h+=row(s.sale==='pof'?'POF sale':s.lens?lenses[s.lens].name:'Complete sale',base()?money(base()):'—');s.selected.forEach(id=>{const m=mods.find(x=>x[0]===id);h+=row(m[1],(m[2]>=0?'+':'-')+money(Math.abs(m[2])))});if(s.wantsAdditional&&s.additionalLens){h+='<div class="divider"></div>'+row('Additional '+lenses[s.additionalLens].name,money(lenses[s.additionalLens].additional));s.additional.forEach(id=>{const m=mods.find(x=>x[0]===id);h+=row('Additional: '+m[1],(m[2]>=0?'+':'-')+money(Math.abs(m[2])))});}}document.getElementById('summary').innerHTML=h;document.getElementById('total').textContent=money(total());document.getElementById('copy').disabled=!s.frame}function row(a,b){return `<div class="summary-row"><span>${a}</span><strong>${b}</strong></div>`}
    document.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(!a)return;const [type,val]=a.dataset.action.split(':');if(type==='frame')s.frame=val;if(type==='sale'){s.sale=val;s.lens=null;s.wantsMods=null;s.selected=[];s.wantsAdditional=null;s.additionalLens=null;s.additional=[]}if(type==='lens')s.lens=val;if(type==='mods'){s.wantsMods=val==='yes';if(val==='no')s.selected=[]}if(type==='mod')s.selected=s.selected.includes(val)?s.selected.filter(x=>x!==val):[...s.selected,val];if(type==='additional'){s.wantsAdditional=val==='yes';if(val==='yes')s.additionalLens=s.lens||'core';else{s.additionalLens=null;s.additional=[]}}if(type==='additionalLens')s.additionalLens=val;if(type==='additionalMod')s.additional=s.additional.includes(val)?s.additional.filter(x=>x!==val):[...s.additional,val];render()});
    document.getElementById('reset').onclick=()=>{s={frame:null,sale:null,lens:null,wantsMods:null,selected:[],wantsAdditional:null,additionalLens:null,additional:[]};render()};document.getElementById('copy').onclick=async()=>{const lines=['THAT EYE PLACE — SALES QUOTE'];if(s.frame)lines.push('Frame: '+frames[s.frame].name);if(s.sale==='pof')lines.push('POF sale: '+money(base()));if(s.sale==='complete'&&s.lens)lines.push('Complete pair — '+lenses[s.lens].name+': '+money(base()));s.selected.forEach(id=>{const m=mods.find(x=>x[0]===id);lines.push(m[1]+': '+(m[2]>=0?'+':'-')+money(Math.abs(m[2])))});if(s.wantsAdditional&&s.additionalLens){lines.push('Additional pair — '+lenses[s.additionalLens].name+': '+money(lenses[s.additionalLens].additional));s.additional.forEach(id=>{const m=mods.find(x=>x[0]===id);lines.push('Additional pair '+m[1]+': '+(m[2]>=0?'+':'-')+money(Math.abs(m[2])))});lines.push('Additional pair requires the same prescription.')}lines.push('TOTAL: '+money(total()));try{await navigator.clipboard.writeText(lines.join('\n'))}catch{const t=document.createElement('textarea');t.value=lines.join('\n');document.body.append(t);t.select();document.execCommand('copy');t.remove()}const b=document.getElementById('copy');b.textContent='✓ Copied';setTimeout(()=>b.textContent='▣ Copy Quote',1600)};render();
  </script>
</body>
</html>
